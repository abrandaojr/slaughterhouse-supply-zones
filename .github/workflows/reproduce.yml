name: reproduce-and-test

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Reproduce from synthetic inputs
        run: python -m supply_zones all --clean
      - name: Test
        run: pytest
      - name: Upload generated results
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-supply-zone-results
          path: outputs/

