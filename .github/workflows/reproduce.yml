name: reproduce-and-test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies for PDF export
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc wkhtmltopdf
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Reproduce from synthetic inputs
        run: python -m supply_zones all --clean
      - name: Test
        run: pytest
      - name: Upload generated results
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-supply-zone-results
          path: outputs/
      - name: Commit regenerated outputs (including REPORT.pdf)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ outputs/
          git diff --cached --quiet || git commit -m "Auto-regenerate reproducible outputs, including REPORT.pdf [skip ci]"
          git push
